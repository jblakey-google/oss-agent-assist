<template>
  <lightning-card
    title="Google Cloud Agent Assist Custom Starter Kit"
    icon-name="utility:custom_apps"
  >
    <div class="slds-p-around_medium">
      <!-- Status Bar -->
      <div class="slds-m-bottom_medium slds-p-around_small slds-theme_shade slds-border_around slds-radius_medium">
        <div class="slds-grid slds-grid_vertical-align-center">
          <div class="slds-m-right_small">
            <span class="slds-badge slds-theme_success">Connected</span>
          </div>
          <div class="slds-text-body_small slds-text-color_weak">
            {statusMessage}
          </div>
        </div>
      </div>

      <div class="slds-grid slds-gutters">
        <!-- Left Column: Custom Chat Controls -->
        <div class="slds-col slds-size_1-of-2">
          <div class="slds-text-heading_small slds-m-bottom_small">
            Simulate Custom Chat / Telephony Turns
          </div>

          <!-- User Message Input -->
          <div class="slds-form-element slds-m-bottom_medium">
            <label class="slds-form-element__label" for="user-input">
              Send Customer / End User Message (END_USER)
            </label>
            <div class="slds-form-element__control slds-grid">
              <input
                id="user-input"
                type="text"
                class="slds-input slds-m-right_x-small"
                placeholder="e.g. Can you check the price of the pixel 9?"
                value={userMessageInput}
                oninput={handleUserInputChange}
                onkeyup={handleUserInputChange}
              />
              <button
                class="slds-button slds-button_brand"
                onclick={handleSendUserMessage}
              >
                Send User
              </button>
            </div>
          </div>

          <!-- Agent Message Input -->
          <div class="slds-form-element slds-m-bottom_medium">
            <label class="slds-form-element__label" for="agent-input">
              Send Agent Response (HUMAN_AGENT)
            </label>
            <div class="slds-form-element__control slds-grid">
              <input
                id="agent-input"
                type="text"
                class="slds-input slds-m-right_x-small"
                placeholder="e.g. Sure, I can help look up that information"
                value={agentMessageInput}
                oninput={handleAgentInputChange}
                onkeyup={handleAgentInputChange}
              />
              <button
                class="slds-button slds-button_neutral"
                onclick={handleSendAgentMessage}
              >
                Send Agent
              </button>
            </div>
          </div>

          <!-- Transcript History -->
          <div class="slds-m-top_medium">
            <div class="slds-text-title_caps slds-m-bottom_x-small">
              Conversation Turn Log
            </div>
            <div class="slds-box slds-box_x-small slds-scrollable_y" style="max-height: 200px; background: #fafafa;">
              <template lwc:if={transcriptLogs.length}>
                <template for:each={transcriptLogs} for:item="turn">
                  <div key={turn.id} class="slds-p-vertical_xxx-small slds-text-body_small">
                    <strong>{turn.sender}:</strong> {turn.text}
                  </div>
                </template>
              </template>
              <template lwc:else>
                <span class="slds-text-color_weak slds-text-body_small">No chat turns sent yet.</span>
              </template>
            </div>
          </div>
        </div>

        <!-- Right Column: Real-time Suggestions -->
        <div class="slds-col slds-size_1-of-2">
          <div class="slds-text-heading_small slds-m-bottom_small">
            Incoming Agent Assist Events
          </div>

          <div class="slds-box slds-box_x-small slds-scrollable_y" style="max-height: 340px; background: #0f172a; color: #f8fafc; font-family: monospace; font-size: 11px;">
            <template lwc:if={receivedSuggestions.length}>
              <template for:each={receivedSuggestions} for:item="sug">
                <div key={sug.id} class="slds-m-bottom_small slds-border_bottom slds-p-bottom_x-small">
                  <div style="color: #38bdf8;">[{sug.time}] Suggestion Received:</div>
                  <pre style="margin: 0; white-space: pre-wrap;">{sug.detail}</pre>
                </div>
              </template>
            </template>
            <template lwc:else>
              <span style="color: #94a3b8;">Listening for 'suggestion-received' events...</span>
            </template>
          </div>
        </div>
      </div>
    </div>
  </lightning-card>
</template>
