<template>
  <div class="agent-assist-component">
    <!-- This shows any errors related to config or network in the UI -->
    <div class="load-error" lwc:if={loadError} lwc:ref="loadError">
      <h3>Load Error</h3>
      <p>{loadError.message}</p>
    </div>

    <!-- Empty State View: Shown while waiting for conversation-initialized event -->
    <template lwc:if={showEmptyState}>
      <div
        class="empty-state-container slds-p-around_medium slds-text-align_center"
      >
        <div class="empty-state-illustration slds-m-bottom_small">
          <lightning-icon
            icon-name="utility:chat"
            size="medium"
            variant="brand"
          ></lightning-icon>
        </div>
        <h3
          class="slds-text-heading_small slds-text-title_bold slds-m-bottom_xx-small"
        >
          Waiting for Active Conversation
        </h3>
        <p
          class="slds-text-body_small slds-text-color_weak empty-state-description"
        >
          Agent Assist will only display the features configured for the
          assigned conversation profile once a conversation connects. Read more
          about&#32;<a
            href="https://docs.cloud.google.com/agent-assist/docs/conversation-profile"
            target="_blank"
            rel="noopener noreferrer"
            class="slds-text-link"
            >creating conversation profiles</a
          >.
        </p>
      </div>
    </template>

    <!-- Optionally, the Transcript UI Module will load in here -->
    <div
      class={transcriptContainerClass}
      lwc:if={showTranscript}
      lwc:ref="transcriptContainer"
    >
      <h3>Transcript</h3>
      <div
        class="agent-assist-transcript"
        lwc:dom="manual"
        lwc:ref="agentAssistTranscript"
      ></div>
    </div>

    <!-- The Container UI Module will load in here -->
    <div
      class={containerClass}
      lwc:dom="manual"
      lwc:ref="agentAssistContainer"
    ></div>

    <!-- These components provide access to Salesforce APIs -->
    <lightning-service-cloud-voice-toolkit-api
      lwc:ref="serviceCloudVoiceToolkitApi"
    >
    </lightning-service-cloud-voice-toolkit-api>
    <lightning-conversation-toolkit-api lwc:ref="conversationToolkitApi">
    </lightning-conversation-toolkit-api>
  </div>
</template>
