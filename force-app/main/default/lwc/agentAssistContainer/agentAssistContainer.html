<template>
  <div class="agent-assist-component">
    <!-- Missing/Deleted Profile Error View -->
    <template lwc:if={isProfileMissing}>
      <div
        class="missing-profile-box slds-p-around_medium slds-m-around_small slds-size_1-of-1"
      >
        <div class="slds-media slds-media_center">
          <div class="slds-media__figure">
            <lightning-icon
              icon-name="utility:warning"
              variant="warning"
              size="medium"
            ></lightning-icon>
          </div>
          <div class="slds-media__body">
            <div class="slds-text-heading_small slds-text-color_error">
              <strong>Configuration Profile Deleted or Missing</strong>
            </div>
            <p class="slds-text-body_regular slds-m-top_xx-small">
              The assigned profile
              <code class="missing-code">{configName}</code> was deleted from
              the Setup Wizard or does not exist.
            </p>
            <p
              class="slds-text-body_small slds-text-color_weak slds-m-top_x-small"
            >
              Please select an active profile in
              <strong>Lightning App Builder</strong> or create
              <strong>{configName}</strong> in the
              <strong>Google Cloud Agent Assist Setup Wizard</strong> tab.
            </p>
          </div>
        </div>
      </div>
    </template>

    <!-- Normal Container Execution View -->
    <template lwc:else>
      <!-- This shows any errors related to config or network in the UI -->
      <div class="load-error" lwc:if={loadError} lwc:ref="loadError">
        <h3>Load Error</h3>
        <p>{loadError.message}</p>
      </div>

      <!-- Optionally, the Transcript UI Module will load in here -->
      <div
        class="transcript-container hidden"
        lwc:if={showTranscript}
        lwc:ref="transcriptContainer"
      >
        <h3>Transcript</h3>
        <div
          class="agent-assist-transcript"
          lwc:dom="manual"
          lwc:ref="agentAssistTranscript"
        ></div>
      </div>

      <!-- The Container UI Module will load in here -->
      <div
        class="agent-assist-container"
        lwc:dom="manual"
        lwc:ref="agentAssistContainer"
      ></div>

      <!-- These components provide access to Salesforce APIs -->
      <lightning-service-cloud-voice-toolkit-api
        lwc:ref="serviceCloudVoiceToolkitApi"
      >
      </lightning-service-cloud-voice-toolkit-api>
      <lightning-conversation-toolkit-api lwc:ref="conversationToolkitApi">
      </lightning-conversation-toolkit-api>
    </template>
  </div>
</template>
