<template>
  <div class="wizard-container slds-p-around_medium">
    <!-- Main Header -->
    <div class="slds-m-bottom_small wizard-header-clean">
      <div
        class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-wrap"
      >
        <div class="slds-grid slds-grid_vertical-align-center">
          <img
            src={appIcon}
            alt="Google Cloud Agent Assist Icon"
            class="slds-m-right_small wizard-header-icon"
          />
          <div>
            <h1 class="slds-text-heading_medium header-title">
              Integration Setup Wizard
            </h1>
            <p class="slds-text-body_small slds-text-color_weak">
              Centralized configuration and integration management for Google
              Cloud Agent Assist & Companion Agent
            </p>
          </div>
        </div>
        <div
          class="slds-m-left_small slds-m-top_x-small slds-medium-m-top_none"
        >
          <a
            href="https://docs.cloud.google.com/agent-assist/docs/salesforce"
            target="_blank"
            rel="noopener noreferrer"
            class="doc-pill-link"
          >
            <lightning-icon
              icon-name="utility:knowledge_base"
              size="xx-small"
              class="slds-m-right_xx-small"
            ></lightning-icon>
            Documentation
            <lightning-icon
              icon-name="utility:new_window"
              size="xx-small"
              class="slds-m-left_xx-small"
            ></lightning-icon>
          </a>
        </div>
      </div>
    </div>

    <!-- Sub Pages Tabset -->
    <lightning-tabset active-tab-value={activeTab}>
      <!-- 1. LWC Configuration Profiles Panel -->
      <lightning-tab
        label="LWC Configuration Profiles"
        value="configurationProfiles"
        icon-name="utility:bundle_config"
        onactive={handleTabActive}
      >
        <c-agent-assist-setup-profiles-panel
          profiles={profiles}
          selected-dev-name={selectedDevName}
          current-profile={currentProfile}
          onopennewprofilemodal={handleOpenNewProfileModal}
          onprofileselect={handleProfileSelect}
          ontypeswitch={handleTypeSwitch}
          onfieldchange={handleFieldChange}
          onsaveprofile={handleSaveProfile}
          onsaveascopy={handleSaveAsCopy}
          ondeleteprofile={handleDeleteProfile}
          onresetprofile={handleResetSingleProfile}
        ></c-agent-assist-setup-profiles-panel>
      </lightning-tab>

      <!-- 2. Simulator Panel -->
      <lightning-tab
        label="Simulator"
        value="simulator"
        icon-name="utility:chat"
        onactive={handleTabActive}
      >
        <c-agent-assist-setup-simulator-panel
          profiles={profiles}
          simulator-profile-dev-name={simulatorProfileDevName}
          onsimulatorprofilechange={handleSimulatorProfileChange}
        ></c-agent-assist-setup-simulator-panel>
      </lightning-tab>

      <!-- 3. CX Platform Setup Panel -->
      <lightning-tab
        label="CX Platform Setup"
        value="cxPlatformSetup"
        icon-name="utility:call"
        onactive={handleTabActive}
      >
        <c-agent-assist-setup-cx-platform-panel></c-agent-assist-setup-cx-platform-panel>
      </lightning-tab>

      <!-- 4. Users & Permission Set Assignment Panel -->
      <lightning-tab
        label="Users"
        value="users"
        icon-name="utility:user"
        onactive={handleTabActive}
      >
        <c-agent-assist-setup-users-panel></c-agent-assist-setup-users-panel>
      </lightning-tab>

      <!-- 5. Integration Diagnostics Panel -->
      <lightning-tab
        label="Integration Diagnostics"
        value="diagnostics"
        icon-name="utility:connected_apps"
        onactive={handleTabActive}
      >
        <c-agent-assist-setup-diagnostics-panel></c-agent-assist-setup-diagnostics-panel>
      </lightning-tab>
    </lightning-tabset>

    <!-- Modal: Select Profile Type -->
    <template lwc:if={isTypeModalOpen}>
      <section
        role="dialog"
        tabindex="-1"
        class="slds-modal slds-fade-in-open slds-modal_medium"
        aria-labelledby="modal-heading-01"
        aria-modal="true"
      >
        <div class="slds-modal__container">
          <!-- Modal Header -->
          <header class="slds-modal__header">
            <button
              type="button"
              class="slds-button slds-button_icon slds-modal__close"
              title="Close"
              onclick={handleCloseTypeModal}
            >
              <lightning-icon
                icon-name="utility:close"
                alternative-text="Close"
                size="small"
              ></lightning-icon>
              <span class="slds-assistive-text">Close</span>
            </button>
            <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
              Select LWC Profile Type
            </h2>
            <p
              class="slds-m-top_x-small slds-text-body_small slds-text-color_weak"
            >
              Choose an LWC configuration profile type to create for your
              contact center agents.
            </p>
          </header>

          <!-- Modal Body -->
          <div class="slds-modal__content slds-p-around_large modal-content-bg">
            <div class="slds-m-bottom_medium">
              <div
                class="slds-box slds-box_small slds-theme_default info-panel-box slds-p-around_medium"
              >
                <div
                  class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small"
                >
                  <lightning-icon
                    icon-name="utility:bundle_config"
                    size="small"
                    class="slds-m-right_x-small"
                  ></lightning-icon>
                  <strong class="slds-text-heading_small"
                    >How LWC Configuration Profiles Work</strong
                  >
                </div>
                <p
                  class="slds-text-body_small slds-text-color_weak slds-p-left_small slds-m-bottom_xx-small"
                >
                  <strong>Dropdown Select in Lightning Editor:</strong>&#32;Every LWC configuration profile created here is
                  automatically populated into the&#32;<strong>LWC Configuration Profile Name</strong>&#32;dropdown in Lightning App Builder. Drop the&#32;<code class="xml-code">agentAssistContainer</code>&#32;or&#32;<code class="xml-code">agentAssistCompanionAgent</code>&#32;on any page and select the profile directly from the picklist.
                </p>
              </div>
            </div>

            <div class="slds-grid slds-gutters slds-wrap">
              <!-- Option 1: Companion Agent -->
              <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
              >
                <div
                  class="type-selection-card slds-p-around_medium"
                  data-type="Companion Agent"
                  onclick={handleSelectTypeFromModal}
                >
                  <div
                    class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small"
                  >
                    <div class="slds-grid slds-grid_vertical-align-center">
                      <lightning-icon
                        icon-name="standard:bot"
                        size="medium"
                        class="slds-m-right_small"
                      ></lightning-icon>
                      <div>
                        <h3
                          class="slds-text-heading_small slds-text-title_bold card-main-title"
                        >
                          Companion Agent
                        </h3>
                        <p class="slds-text-body_small slds-text-color_weak">
                          Agent Facing AI Chat
                        </p>
                      </div>
                    </div>
                    <span class="slds-badge slds-theme_info modal-badge-newer"
                      >Newer</span
                    >
                  </div>

                  <ul class="type-feature-list slds-m-bottom_medium">
                    <li>
                      <span class="check-icon">✓</span>&#32;Supports Most and
                      Latest Features
                    </li>
                    <li>
                      <span class="check-icon">✓</span>&#32;Agent Facing AI Chat
                    </li>
                    <li>
                      <span class="check-icon">✓</span>&#32;Next Best Action
                      Suggestions
                    </li>
                    <li>
                      <span class="check-icon">✓</span>&#32;Knowledge Search
                    </li>
                    <li><span class="check-icon">✓</span>&#32;Summarization</li>
                    <li>
                      <span class="check-icon">✓</span>&#32;Real-time
                      Transcription
                    </li>
                  </ul>

                  <button
                    type="button"
                    class="slds-button slds-button_brand slds-button_stretch slds-m-top_medium"
                  >
                    Select Companion Agent
                  </button>
                </div>
              </div>

              <!-- Option 2: Container Module -->
              <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
              >
                <div
                  class="type-selection-card slds-p-around_medium"
                  data-type="Container"
                  onclick={handleSelectTypeFromModal}
                >
                  <div
                    class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small"
                  >
                    <div class="slds-grid slds-grid_vertical-align-center">
                      <lightning-icon
                        icon-name="standard:service_crew_member"
                        size="medium"
                        class="slds-m-right_small"
                      ></lightning-icon>
                      <div>
                        <h3
                          class="slds-text-heading_small slds-text-title_bold card-main-title"
                        >
                          Container Module
                        </h3>
                        <p class="slds-text-body_small slds-text-color_weak">
                          Established Integration
                        </p>
                      </div>
                    </div>
                    <span
                      class="slds-badge slds-theme_success modal-badge-established"
                      >Established</span
                    >
                  </div>

                  <ul class="type-feature-list slds-m-bottom_medium">
                    <li>
                      <span class="check-icon">✓</span>&#32;Supports all
                      Existing Features
                    </li>
                    <li>
                      <span class="check-icon">✓</span>&#32;Well Documented, GA
                    </li>
                    <li><span class="check-icon">✓</span>&#32;AI Coach</li>
                    <li>
                      <span class="check-icon">✓</span>&#32;Knowledge Search
                    </li>
                    <li><span class="check-icon">✓</span>&#32;Summarization</li>
                    <li>
                      <span class="check-icon">✓</span>&#32;Real-time
                      Transcription
                    </li>
                  </ul>

                  <button
                    type="button"
                    class="slds-button slds-button_brand slds-button_stretch slds-m-top_medium"
                  >
                    Select Container Module
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Modal Footer -->
          <footer class="slds-modal__footer">
            <button
              type="button"
              class="slds-button slds-button_neutral"
              onclick={handleCloseTypeModal}
            >
              Cancel
            </button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
  </div>
</template>
