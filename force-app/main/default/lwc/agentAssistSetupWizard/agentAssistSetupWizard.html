<template>
  <div class="wizard-container slds-p-around_medium">
    <!-- Main Header -->
    <div class="slds-m-bottom_small wizard-header-clean">
      <div class="slds-grid slds-grid_vertical-align-center">
        <img
          src={appIcon}
          alt="Google Cloud Agent Assist Icon"
          class="slds-m-right_small wizard-header-icon"
        />
        <div>
          <h1 class="slds-text-heading_medium header-title">Setup Wizard</h1>
          <p class="slds-text-body_small slds-text-color_weak">
            Centralized configuration and integration management for Google
            Cloud Agent Assist & Companion Agent
          </p>
        </div>
      </div>
    </div>

    <!-- Sub Pages Tabset -->
    <lightning-tabset active-tab-value={activeTab} onselect={handleTabSelect}>
      <!-- 1. Configuration Profiles -->
      <lightning-tab
        label="Configuration Profiles"
        value="configurationProfiles"
        icon-name="utility:bundle_config"
      >
        <div class="slds-p-top_medium">
          <!-- Responsive Layout Grid -->
          <div class="slds-grid slds-gutters slds-wrap">
            <!-- Left Column: Profile Selector List -->
            <div
              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-3 slds-m-bottom_medium"
            >
              <lightning-card
                title="Configuration Profiles"
                icon-name="utility:bundle_config"
              >
                <div class="slds-p-around_small">
                  <div class="slds-m-bottom_small">
                    <button
                      type="button"
                      class="slds-button slds-button_brand slds-button_stretch slds-size_1-of-1"
                      onclick={handleOpenNewProfileModal}
                    >
                      <lightning-icon
                        icon-name="utility:add"
                        size="x-small"
                        variant="inverse"
                        class="slds-m-right_x-small"
                      ></lightning-icon>
                      New Profile
                    </button>
                  </div>

                  <p
                    class="slds-text-body_small slds-text-color_weak slds-m-bottom_small"
                  >
                    Select a profile to edit. Profiles appear in the Lightning
                    Editor dropdown for
                    <code class="xml-code">agentAssistContainer</code> or
                    <code class="xml-code">agentAssistCompanionAgent</code>.
                  </p>

                  <div class="slds-nav-vertical">
                    <template for:each={profileList} for:item="prof">
                      <div
                        key={prof.id}
                        class={prof.cssClass}
                        onclick={handleSelectProfile}
                        data-id={prof.developerName}
                      >
                        <div
                          class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
                        >
                          <div>
                            <div class="slds-text-title_bold">{prof.name}</div>
                            <div
                              class="slds-text-body_small slds-text-color_weak slds-m-top_xxx-small"
                            >
                              configName: <strong>{prof.developerName}</strong>
                            </div>
                            <div
                              class="slds-text-body_small slds-m-top_xxx-small slds-grid slds-grid_vertical-align-center"
                            >
                              <span
                                class="slds-text-color_weak slds-m-right_xxx-small"
                                >type:</span
                              >
                              <span class={prof.typeClass}
                                >{prof.typeLabel}</span
                              >
                            </div>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>
                </div>
              </lightning-card>
            </div>

            <!-- Middle Column: Profile Editor Form -->
            <div
              class="slds-col slds-size_1-of-1 slds-medium-size_2-of-3 slds-m-bottom_medium"
            >
              <lightning-card title={editorCardTitle} icon-name="utility:edit">
                <div class="slds-p-around_medium">
                  <!-- Segmented Type Selector Bar: Type: Companion Agent || Container -->
                  <div
                    class="type-selector-bar slds-box slds-box_x-small slds-theme_shade slds-m-bottom_medium slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
                  >
                    <div class="slds-grid slds-grid_vertical-align-center">
                      <span class="slds-text-title_bold slds-m-right_small"
                        >Type:</span
                      >
                      <div class="slds-button-group" role="group">
                        <button
                          type="button"
                          class={companionTypeBtnClass}
                          data-type="Companion Agent"
                          onclick={handleTypeSwitch}
                        >
                          Companion Agent
                        </button>
                        <button
                          type="button"
                          class={containerTypeBtnClass}
                          data-type="Container"
                          onclick={handleTypeSwitch}
                        >
                          Container
                        </button>
                      </div>
                    </div>
                  </div>

                  <!-- Form Inputs Reflecting Correct Schema -->
                  <div class="slds-grid slds-gutters slds-wrap">
                    <!-- Common Fields -->
                    <div
                      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
                    >
                      <lightning-input
                        label="Display Name"
                        value={currentProfile.name}
                        data-field="name"
                        onchange={handleFieldChange}
                        required
                      >
                      </lightning-input>
                    </div>
                    <div
                      class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
                    >
                      <lightning-input
                        label="Developer Name"
                        value={currentProfile.developerName}
                        data-field="developerName"
                        onchange={handleFieldChange}
                        field-level-help="Unique key referenced in Lightning App Builder picklist."
                        disabled={isDeveloperNameDisabled}
                        required
                      >
                      </lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                      <lightning-input
                        label="Header Title"
                        value={currentProfile.title}
                        data-field="title"
                        onchange={handleFieldChange}
                      >
                      </lightning-input>
                    </div>

                    <div class="slds-col slds-size_1-of-1 slds-m-bottom_small">
                      <lightning-input
                        label="Assist Service Endpoint URL"
                        value={currentProfile.endpointUrl}
                        data-field="endpointUrl"
                        onchange={handleFieldChange}
                      >
                      </lightning-input>
                    </div>

                    <!-- Container Schema Fields -->
                    <template lwc:if={isContainerProfile}>
                      <div
                        class="slds-col slds-size_1-of-1 slds-m-top_x-small slds-m-bottom_small"
                      >
                        <div class="slds-box slds-box_x-small slds-theme_shade">
                          <div
                            class="slds-text-title_caps slds-m-bottom_x-small"
                          >
                            Container Schema Settings
                          </div>
                          <div class="slds-grid slds-gutters slds-wrap">
                            <div
                              class="slds-col slds-size_1-of-1 slds-m-bottom_small"
                            >
                              <lightning-input
                                label="Conversation Profile Resource Name"
                                value={currentProfile.conversationProfile}
                                data-field="conversationProfile"
                                onchange={handleFieldChange}
                                placeholder="projects/{project-id}/locations/{location-id}/conversationProfiles/{profile-id}"
                                field-level-help="The full resource name of the Conversation Profile in Google Cloud."
                                required
                              >
                              </lightning-input>
                            </div>

                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
                            >
                              <lightning-combobox
                                label="Conversation Channel"
                                value={currentProfile.channel}
                                options={channelOptions}
                                data-field="channel"
                                onchange={handleFieldChange}
                                field-level-help="The conversation channel, either chat or voice."
                              >
                              </lightning-combobox>
                            </div>

                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
                            >
                              <lightning-combobox
                                label="Platform Integration"
                                value={currentProfile.platform}
                                options={platformOptions}
                                data-field="platform"
                                onchange={handleFieldChange}
                                field-level-help="Salesforce platform integration type."
                              >
                              </lightning-combobox>
                            </div>

                            <div
                              class="slds-col slds-size_1-of-1 slds-m-bottom_small"
                            >
                              <div
                                class="slds-box slds-box_x-small slds-theme_shade slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap"
                              >
                                <div
                                  class="slds-col slds-grow slds-grid slds-grid_vertical-align-center slds-p-right_small slds-m-bottom_x-small slds-medium-m-bottom_none"
                                >
                                  <lightning-icon
                                    icon-name="utility:connected_apps"
                                    size="small"
                                    class="slds-m-right_x-small slds-no-flex"
                                  ></lightning-icon>
                                  <div>
                                    <strong
                                      >External Client App OAuth
                                      Settings</strong
                                    >
                                    <div
                                      class="slds-text-body_small slds-text-color_weak"
                                    >
                                      Retrieve your Consumer Key (Client ID) &
                                      Consumer Secret from External Client App
                                      Manager.
                                    </div>
                                  </div>
                                </div>
                                <div
                                  class="slds-col slds-no-flex slds-size_1-of-1 slds-medium-size_auto"
                                  style="min-width: 250px"
                                >
                                  <a
                                    href="/lightning/setup/ManageExternalClientApplication/home"
                                    target="_blank"
                                    rel="noopener noreferrer"
                                    class="slds-button slds-button_neutral slds-button_stretch slds-grid slds-grid_align-center slds-grid_vertical-align-center"
                                  >
                                    <lightning-icon
                                      icon-name="utility:new_window"
                                      size="x-small"
                                      class="slds-m-right_xx-small"
                                    ></lightning-icon>
                                    <span>External Client App Manager</span>
                                  </a>
                                </div>
                              </div>
                            </div>

                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
                            >
                              <lightning-input
                                label="External Client App Consumer Key"
                                value={currentProfile.consumerKey}
                                data-field="consumerKey"
                                onchange={handleFieldChange}
                                field-level-help="Consumer Key from your Salesforce External Client App for authentication."
                              >
                              </lightning-input>
                            </div>

                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
                            >
                              <lightning-input
                                type="password"
                                label="External Client App Consumer Secret"
                                value={currentProfile.consumerSecret}
                                data-field="consumerSecret"
                                onchange={handleFieldChange}
                                field-level-help="Consumer Secret from your Salesforce External Client App."
                              >
                              </lightning-input>
                            </div>

                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
                            >
                              <lightning-input
                                label="Container Height"
                                value={currentProfile.containerHeight}
                                data-field="containerHeight"
                                onchange={handleFieldChange}
                                placeholder="530px"
                                field-level-help="The height of the Agent Assist container (e.g. 530px)."
                              >
                              </lightning-input>
                            </div>

                            <div
                              class="slds-col slds-size_1-of-1 slds-m-top_xx-small"
                            >
                              <div class="slds-grid slds-gutters slds-wrap">
                                <div
                                  class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_small"
                                >
                                  <lightning-input
                                    type="toggle"
                                    label="Debug Mode"
                                    checked={currentProfile.debugMode}
                                    data-field="debugMode"
                                    onchange={handleFieldChange}
                                  >
                                  </lightning-input>
                                </div>
                                <div
                                  class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_small"
                                >
                                  <lightning-input
                                    type="toggle"
                                    label="Dark Mode Toggle"
                                    checked={currentProfile.showDarkModeToggle}
                                    data-field="showDarkModeToggle"
                                    onchange={handleFieldChange}
                                  >
                                  </lightning-input>
                                </div>
                                <div
                                  class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_small"
                                >
                                  <lightning-input
                                    type="toggle"
                                    label="Show Header"
                                    checked={currentProfile.showHeader}
                                    data-field="showHeader"
                                    onchange={handleFieldChange}
                                  >
                                  </lightning-input>
                                </div>
                                <div
                                  class="slds-col slds-size_1-of-2 slds-medium-size_1-of-4 slds-m-bottom_small"
                                >
                                  <lightning-input
                                    type="toggle"
                                    label="Correctness Feedback"
                                    checked={currentProfile.showCorrectnessFeedback}
                                    data-field="showCorrectnessFeedback"
                                    onchange={handleFieldChange}
                                  >
                                  </lightning-input>
                                </div>
                              </div>
                            </div>
                          </div>
                        </div>
                      </div>
                    </template>

                    <!-- Companion Agent Schema Fields -->
                    <template lwc:if={isCompanionProfile}>
                      <div
                        class="slds-col slds-size_1-of-1 slds-m-top_x-small slds-m-bottom_small"
                      >
                        <div class="slds-box slds-box_x-small slds-theme_shade">
                          <div
                            class="slds-text-title_caps slds-m-bottom_x-small"
                          >
                            Companion Agent Schema Settings
                          </div>
                          <div class="slds-grid slds-gutters slds-wrap">
                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
                            >
                              <lightning-input
                                label="AI Model Name"
                                value={currentProfile.modelName}
                                data-field="modelName"
                                onchange={handleFieldChange}
                                placeholder="gemini-1.5-pro"
                              >
                              </lightning-input>
                            </div>
                            <div
                              class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
                            >
                              <lightning-input
                                type="toggle"
                                label="Enable Autonomous Actions"
                                checked={currentProfile.enableAutonomousActions}
                                data-field="enableAutonomousActions"
                                onchange={handleFieldChange}
                              >
                              </lightning-input>
                            </div>
                            <div class="slds-col slds-size_1-of-1">
                              <lightning-textarea
                                label="Welcome Greeting & Instructions"
                                value={currentProfile.welcomeMessage}
                                data-field="welcomeMessage"
                                onchange={handleFieldChange}
                              >
                              </lightning-textarea>
                            </div>
                          </div>
                        </div>
                      </div>
                    </template>
                  </div>

                  <!-- Form Actions -->
                  <div
                    class="slds-m-top_medium slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-border_top slds-p-top_medium"
                  >
                    <lightning-button
                      label="Delete Profile"
                      variant="destructive-text"
                      icon-name="utility:delete"
                      onclick={handleDeleteProfile}
                      disabled={isDefaultProfile}
                    >
                    </lightning-button>
                    <div>
                      <lightning-button
                        label="Save Profile"
                        variant="brand"
                        icon-name="utility:save"
                        onclick={handleSaveProfile}
                      ></lightning-button>
                    </div>
                  </div>
                </div>
              </lightning-card>

              <!-- Architecture & Picklist Info Callout -->
              <div class="slds-m-top_medium">
                <div
                  class="slds-box slds-box_small slds-theme_shade info-panel-box slds-p-around_medium"
                >
                  <div
                    class="slds-grid slds-grid_vertical-align-center slds-m-bottom_x-small"
                  >
                    <lightning-icon
                      icon-name="utility:bundle_config"
                      size="small"
                      class="slds-m-right_x-small"
                    ></lightning-icon>
                    <strong class="slds-text-heading_small"
                      >How Configuration Profiles Work</strong
                    >
                  </div>
                  <p
                    class="slds-text-body_small slds-text-color_weak slds-p-left_small slds-m-bottom_xx-small"
                  >
                    <strong>Dropdown Select in Lightning Editor:</strong> Every
                    configuration profile created here is automatically
                    populated into the
                    <strong>Configuration Profile Name</strong> dropdown in
                    Lightning App Builder. Drop the
                    <code class="xml-code">agentAssistContainer</code> or
                    <code class="xml-code">agentAssistCompanionAgent</code> on
                    any page (Record Page, Utility Bar, App Page) and select the
                    profile directly from the picklist.
                  </p>
                </div>
              </div>
            </div>
          </div>
        </div>
      </lightning-tab>

      <!-- 2. Simulator -->
      <lightning-tab
        label="Simulator"
        value="simulator"
        icon-name="utility:chat"
      >
        <div class="slds-p-top_medium">
          <lightning-card
            title="Live LWC Component Simulator"
            icon-name="utility:chat"
          >
            <div class="slds-p-around_medium">
              <p class="slds-text-body_regular slds-m-bottom_medium">
                Select any configuration profile to instantiate and test the
                live&#32;<strong>agentAssistContainer</strong>&#32;or&#32;
                <strong>agentAssistCompanionAgent</strong>&#32;LWC component
                directly inside the simulator.
              </p>

              <!-- Profile Selector for Simulator -->
              <div
                class="slds-box slds-theme_shade slds-m-bottom_medium slds-p-around_medium"
              >
                <div
                  class="slds-grid slds-gutters slds-grid_vertical-align-center slds-wrap"
                >
                  <div
                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2"
                  >
                    <lightning-combobox
                      label="Configuration Profile to Instantiate"
                      value={simulatorProfileDevName}
                      options={simulatorProfileOptions}
                      onchange={handleSimulatorProfileChange}
                      field-level-help="Select a configuration profile to preview the live LWC."
                    >
                    </lightning-combobox>
                  </div>
                  <div
                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-m-top_small slds-medium-m-top_none"
                  >
                    <div class="slds-text-title_bold">
                      Instantiated LWC Type:
                    </div>
                    <div class="slds-text-body_small slds-m-top_xxx-small">
                      <span
                        class="slds-badge slds-badge_inverse slds-m-right_xx-small"
                        >{simulatorProfile.profileType}</span
                      >
                      <code>{simulatorProfileDevName}</code>
                    </div>
                  </div>
                  <div
                    class="slds-col slds-size_1-of-1 slds-medium-size_1-of-4 slds-m-top_small slds-medium-m-top_none slds-grid slds-grid_vertical-align-end"
                  >
                    <lightning-button
                      label="Reload Component"
                      title="Reload/Remount LWC in Simulator"
                      icon-name="utility:refresh"
                      onclick={handleReloadSimulator}
                      class="slds-size_1-of-1"
                    >
                    </lightning-button>
                  </div>
                </div>
              </div>

              <!-- Live Instantiated Container LWC -->
              <template lwc:if={isSimulatorContainer}>
                <div class="slds-m-top_medium">
                  <c-agent-assist-container
                    config-name={simulatorProfileDevName}
                  ></c-agent-assist-container>
                </div>
              </template>

              <!-- Live Instantiated Companion Agent LWC -->
              <template lwc:if={isSimulatorCompanion}>
                <div class="slds-m-top_medium">
                  <c-agent-assist-companion-agent
                    config-name={simulatorProfileDevName}
                  ></c-agent-assist-companion-agent>
                </div>
              </template>
            </div>
          </lightning-card>
        </div>
      </lightning-tab>

      <!-- 3. CX Platform Specific Setup -->
      <lightning-tab
        label="CX Platform Setup"
        value="cxPlatformSetup"
        icon-name="utility:call"
      >
        <div class="slds-p-top_medium">
          <lightning-card
            title="Contact Center (CX) Platform Integration Guides"
            icon-name="utility:call"
          >
            <div class="slds-p-around_medium">
              <p class="slds-text-body_regular slds-m-bottom_medium">
                Step-by-step instructions, documentation links, and checklists
                for connecting your contact center platform to Google Cloud
                Agent Assist & Companion Agent.
              </p>

              <lightning-accordion active-section-name="genesys">
                <lightning-accordion-section
                  name="genesys"
                  label="Genesys Cloud CX Setup"
                >
                  <div class="slds-p-around_small slds-theme_shade">
                    <p class="slds-text-body_small slds-m-bottom_x-small">
                      Integrate with Genesys Cloud via AudioHook WebSocket
                      streams and custom Client Application widgets.
                    </p>
                    <ul
                      class="slds-list_dotted slds-text-body_small slds-m-bottom_small"
                    >
                      <li>
                        Create an AudioHook integration in Genesys Cloud Admin.
                      </li>
                      <li>
                        Configure Client Credentials OAuth grant with required
                        permissions.
                      </li>
                      <li>
                        Embed the Agent Assist or Companion Agent Interaction
                        Widget in Genesys Agent Workspace.
                      </li>
                    </ul>
                    <lightning-button
                      label="View Genesys Cloud Setup Guide"
                      icon-name="utility:new_window"
                      variant="neutral"
                      onclick={handlePlaceholderAction}
                    ></lightning-button>
                  </div>
                </lightning-accordion-section>

                <lightning-accordion-section
                  name="twilio"
                  label="Twilio Flex Setup"
                >
                  <div class="slds-p-around_small slds-theme_shade">
                    <p class="slds-text-body_small slds-m-bottom_x-small">
                      Deploy the Agent Assist Flex Plugin to Twilio Flex UI and
                      route media streams to the UI Connector backend.
                    </p>
                    <ul
                      class="slds-list_dotted slds-text-body_small slds-m-bottom_small"
                    >
                      <li>
                        Install and build the Flex UI Agent Assist Plugin.
                      </li>
                      <li>
                        Configure bidirectional media streaming in TwiML/Studio
                        Flow.
                      </li>
                      <li>
                        Configure SSO authentication bridging Flex agent
                        sessions to Salesforce.
                      </li>
                    </ul>
                    <lightning-button
                      label="View Twilio Flex Setup Guide"
                      icon-name="utility:new_window"
                      variant="neutral"
                      onclick={handlePlaceholderAction}
                    ></lightning-button>
                  </div>
                </lightning-accordion-section>

                <lightning-accordion-section
                  name="scv"
                  label="Salesforce Service Cloud Voice & Omni-Channel"
                >
                  <div class="slds-p-around_small slds-theme_shade">
                    <p class="slds-text-body_small slds-m-bottom_x-small">
                      Connect Service Cloud Voice telephony streams and digital
                      messaging sessions directly to Agent Assist.
                    </p>
                    <ul
                      class="slds-list_dotted slds-text-body_small slds-m-bottom_small"
                    >
                      <li>
                        Enable VoiceCall Real-Time Audio Streaming in Voice
                        settings.
                      </li>
                      <li>
                        Configure Omni-Channel presence statuses and queue
                        routing.
                      </li>
                      <li>
                        Place the
                        <code class="xml-code">agentAssistContainer</code> or
                        <code class="xml-code">agentAssistCompanionAgent</code>
                        LWC on VoiceCall and MessagingSession record pages.
                      </li>
                    </ul>
                    <lightning-button
                      label="View Service Cloud Voice Guide"
                      icon-name="utility:new_window"
                      variant="neutral"
                      onclick={handlePlaceholderAction}
                    ></lightning-button>
                  </div>
                </lightning-accordion-section>
              </lightning-accordion>
            </div>
          </lightning-card>
        </div>
      </lightning-tab>

      <!-- 4. Integration Diagnostics -->
      <lightning-tab
        label={diagnosticsTabLabel}
        value="diagnostics"
        icon-name={diagnosticsTabIcon}
      >
        <div class="slds-p-top_medium">
          <!-- 1. System Diagnostics & Category Master Overview -->
          <lightning-card
            title="Integration Diagnostics Overview"
            icon-name="utility:connected_apps"
            class="slds-m-bottom_medium"
          >
            <div slot="actions">
              <lightning-button
                label="Run All Diagnostics"
                icon-name="utility:refresh"
                variant="brand"
                onclick={handleRunDiagnostics}
              ></lightning-button>
            </div>
            <div class="slds-p-around_medium">
              <!-- Master Status Instrument Bar -->
              <div
                class="instrument-bar slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap"
              >
                <div
                  class="slds-grid slds-grid_vertical-align-center slds-m-right_medium"
                >
                  <strong class="slds-text-heading_small slds-m-right_small"
                    >Status:</strong
                  >
                  <span class="slds-text-body_small slds-text-color_weak">
                    Integration readiness and platform system health at a
                    glance.
                  </span>
                </div>
                <span class={masterStatusPillClass}>
                  <span class={masterStatusLedClass}></span>
                  <span>{masterStatusLabel}</span>
                </span>
              </div>

              <!-- All 5 Category Master Instrument Cards Grid -->
              <div class="category-master-grid">
                <template for:each={topInstrumentCards} for:item="card">
                  <div
                    key={card.id}
                    class="instrument-card slds-p-around_medium"
                  >
                    <!-- Card Header -->
                    <div>
                      <div
                        class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_x-small"
                      >
                        <strong
                          class="slds-text-title_bold slds-truncate slds-m-right_small"
                          title={card.title}
                          >{card.title}</strong
                        >
                        <span class={card.secPillClass} style="flex-shrink: 0">
                          <span class={card.secLedClass}></span>
                          <span>{card.secStatusText}</span>
                        </span>
                      </div>

                      <p
                        class="slds-text-body_small slds-text-color_weak slds-m-bottom_medium"
                      >
                        {card.subtitle}
                      </p>
                    </div>

                    <!-- Clean Scannable Footer with Metric & Setup Link -->
                    <div
                      class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-border_top slds-p-top_x-small slds-m-top_auto"
                    >
                      <span class="slds-text-body_small slds-text-color_weak">
                        <strong>{card.summaryMetricText}</strong>
                      </span>
                      <template lwc:if={card.setupUrl}>
                        <a
                          href={card.setupUrl}
                          target="_blank"
                          class="slds-text-link slds-text-body_small"
                          title="Open in Salesforce Setup"
                        >
                          <strong>{card.setupUrlLabel} Setup ↗</strong>
                        </a>
                      </template>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </lightning-card>

          <!-- 2. Detailed Diagnostics & Salesforce Org Metadata Inspection -->
          <lightning-card title="Diagnostic Details" icon-name="utility:list">
            <div class="slds-p-around_medium">
              <!-- Consistent Instrument Status Bar -->
              <div
                class="instrument-bar slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-wrap"
              >
                <div
                  class="slds-grid slds-grid_vertical-align-center slds-m-right_medium"
                >
                  <strong class="slds-text-heading_small slds-m-right_small"
                    >Prerequisites Inspection:</strong
                  >
                  <span class="slds-text-body_small slds-text-color_weak">
                    Full enumeration of Salesforce platform configurations,
                    presence statuses, queues, permissions, and metadata.
                  </span>
                </div>
                <span class={masterStatusPillClass}>
                  <span class={masterStatusLedClass}></span>
                  <span>{detailsStatusLabel}</span>
                </span>
              </div>

              <!-- Full Enumeration Sections -->
              <div class="slds-grid slds-gutters slds-wrap">
                <template for:each={detailedPrereqSections} for:item="sec">
                  <div
                    key={sec.id}
                    class="slds-col slds-size_1-of-1 slds-m-bottom_medium"
                  >
                    <div
                      class="slds-box slds-p-around_medium"
                      style="
                        background-color: #ffffff;
                        border-radius: 8px;
                        border: 1px solid #e2e8f0;
                      "
                    >
                      <!-- Section Header -->
                      <div
                        class="slds-grid slds-grid_vertical-align-center slds-grid_align-spread slds-m-bottom_small"
                      >
                        <div
                          class="slds-grid slds-grid_vertical-align-center slds-truncate"
                          style="max-width: 80%"
                        >
                          <lightning-icon
                            icon-name={sec.iconName}
                            size="small"
                            class="slds-m-right_small"
                            style="flex-shrink: 0"
                          ></lightning-icon>
                          <div>
                            <div
                              class="slds-grid slds-grid_vertical-align-center"
                            >
                              <strong class="slds-text-heading_small"
                                >{sec.title}</strong
                              >
                              <template lwc:if={sec.setupUrl}>
                                <a
                                  href={sec.setupUrl}
                                  target="_blank"
                                  class="slds-text-link slds-m-left_small slds-text-body_small"
                                  title="Open in Salesforce Setup"
                                >
                                  <strong>Manage {sec.setupUrlLabel} ↗</strong>
                                </a>
                              </template>
                            </div>
                            <div
                              class="slds-text-body_small slds-text-color_weak"
                            >
                              {sec.subtitle}
                            </div>
                          </div>
                        </div>
                        <span
                          class={sec.secPillClass}
                          style="flex-shrink: 0; margin-left: 12px"
                        >
                          <span class={sec.secLedClass}></span>
                          <span>{sec.secStatusText}</span>
                        </span>
                      </div>

                      <!-- Section Items Table / List -->
                      <div
                        class="slds-box slds-theme_shade slds-p-around_small"
                        style="border-radius: 6px"
                      >
                        <template for:each={sec.items} for:item="item">
                          <div
                            key={item.id}
                            class="slds-p-vertical_x-small slds-border_bottom"
                          >
                            <div
                              class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center"
                            >
                              <div style="max-width: 80%">
                                <div
                                  class="slds-text-body_regular slds-text-title_bold"
                                >
                                  {item.label}
                                </div>
                                <div
                                  class="slds-text-body_small slds-text-color_weak"
                                >
                                  {item.subLabel}
                                </div>
                              </div>
                              <span
                                class={item.statusPillClass}
                                style="flex-shrink: 0; margin-left: 12px"
                              >
                                <span class={item.ledClass}></span>
                                <span>{item.statusLabel}</span>
                              </span>
                            </div>

                            <!-- Red Error Message Callout -->
                            <template lwc:if={item.isFail}>
                              <div class="diag-error-box slds-m-top_x-small">
                                <strong>Diagnostic Failure:</strong>
                                {item.errorMessage}
                              </div>
                            </template>

                            <!-- Assignees / list items enumeration if available -->
                            <template lwc:if={item.hasAssignees}>
                              <div
                                class="slds-m-top_x-small list-container-box"
                              >
                                <div
                                  class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_xxx-small"
                                >
                                  <span
                                    class="slds-text-body_small slds-text-title_bold"
                                    style="color: #334155"
                                  >
                                    Configured Entries & Assignments:
                                  </span>
                                  <template lwc:if={item.countBadgeText}>
                                    <span class="slds-badge slds-badge_lightest"
                                      >{item.countBadgeText}</span
                                    >
                                  </template>
                                </div>
                                <div class="compact-pill-box">
                                  <template
                                    for:each={item.assignees}
                                    for:item="assignee"
                                  >
                                    <span
                                      key={assignee}
                                      class="compact-pill"
                                      title={assignee}
                                      >{assignee}</span
                                    >
                                  </template>
                                  <template lwc:if={item.hasMore}>
                                    <template lwc:if={item.setupUrl}>
                                      <a
                                        href={item.setupUrl}
                                        target="_blank"
                                        class="compact-pill compact-pill_more"
                                        title="Open in Salesforce Setup"
                                      >
                                        +{item.moreCount} more in Setup ↗
                                      </a>
                                    </template>
                                    <template lwc:else>
                                      <span
                                        class="compact-pill compact-pill_more"
                                        >+{item.moreCount} more in Setup ↗</span
                                      >
                                    </template>
                                  </template>
                                </div>
                              </div>
                            </template>
                          </div>
                        </template>
                      </div>
                    </div>
                  </div>
                </template>
              </div>
            </div>
          </lightning-card>
        </div>
      </lightning-tab>
    </lightning-tabset>

    <!-- Modal: Select Profile Type -->
    <template lwc:if={isTypeModalOpen}>
      <section
        role="dialog"
        tabindex="-1"
        class="slds-modal slds-fade-in-open slds-modal_medium"
        aria-labelledby="modal-heading-01"
        aria-modal="true"
      >
        <div class="slds-modal__container">
          <!-- Modal Header -->
          <header class="slds-modal__header">
            <button
              type="button"
              class="slds-button slds-button_icon slds-modal__close"
              title="Close"
              onclick={handleCloseTypeModal}
            >
              <lightning-icon
                icon-name="utility:close"
                alternative-text="Close"
                size="small"
              ></lightning-icon>
              <span class="slds-assistive-text">Close</span>
            </button>
            <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">
              Select Profile Type
            </h2>
            <p
              class="slds-m-top_x-small slds-text-body_small slds-text-color_weak"
            >
              Choose a configuration profile type to create for your contact
              center agents.
            </p>
          </header>

          <!-- Modal Body (Two Selection Cards) -->
          <div class="slds-modal__content slds-p-around_large modal-content-bg">
            <div class="slds-grid slds-gutters slds-wrap">
              <!-- Option 1: Companion Agent -->
              <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
              >
                <div
                  class="type-selection-card slds-p-around_medium"
                  data-type="Companion Agent"
                  onclick={handleSelectTypeFromModal}
                >
                  <div
                    class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small"
                  >
                    <div class="slds-grid slds-grid_vertical-align-center">
                      <lightning-icon
                        icon-name="standard:bot"
                        size="medium"
                        class="slds-m-right_small"
                      ></lightning-icon>
                      <div>
                        <h3
                          class="slds-text-heading_small slds-text-title_bold card-main-title"
                        >
                          Companion Agent
                        </h3>
                        <p class="slds-text-body_small slds-text-color_weak">
                          Agent Facing AI Chat
                        </p>
                      </div>
                    </div>
                    <span class="slds-badge slds-theme_info modal-badge-newer"
                      >Newer</span
                    >
                  </div>

                  <ul class="type-feature-list slds-m-bottom_medium">
                    <li>
                      <span class="check-icon">✓</span> Supports Most and Latest
                      Features
                    </li>
                    <li>
                      <span class="check-icon">✓</span> Agent Facing AI Chat
                    </li>
                    <li>
                      <span class="check-icon">✓</span> Next Best Action
                      Suggestions
                    </li>
                    <li><span class="check-icon">✓</span> Knowledge Search</li>
                    <li><span class="check-icon">✓</span> Summarization</li>
                    <li>
                      <span class="check-icon">✓</span> Real-time Transcription
                    </li>
                  </ul>

                  <button
                    type="button"
                    class="slds-button slds-button_brand slds-button_stretch slds-m-top_medium"
                    data-type="Companion Agent"
                    onclick={handleSelectTypeFromModal}
                  >
                    Select Companion Agent
                  </button>
                </div>
              </div>

              <!-- Option 2: Container Module -->
              <div
                class="slds-col slds-size_1-of-1 slds-medium-size_1-of-2 slds-m-bottom_small"
              >
                <div
                  class="type-selection-card slds-p-around_medium"
                  data-type="Container"
                  onclick={handleSelectTypeFromModal}
                >
                  <div
                    class="slds-grid slds-grid_align-spread slds-grid_vertical-align-center slds-m-bottom_small"
                  >
                    <div class="slds-grid slds-grid_vertical-align-center">
                      <lightning-icon
                        icon-name="standard:service_crew_member"
                        size="medium"
                        class="slds-m-right_small"
                      ></lightning-icon>
                      <div>
                        <h3
                          class="slds-text-heading_small slds-text-title_bold card-main-title"
                        >
                          Container Module
                        </h3>
                        <p class="slds-text-body_small slds-text-color_weak">
                          Established Integration
                        </p>
                      </div>
                    </div>
                    <span
                      class="slds-badge slds-theme_success modal-badge-established"
                      >Established</span
                    >
                  </div>

                  <ul class="type-feature-list slds-m-bottom_medium">
                    <li>
                      <span class="check-icon">✓</span> Supports all Existing
                      Features
                    </li>
                    <li>
                      <span class="check-icon">✓</span> Well Documented, GA
                    </li>
                    <li><span class="check-icon">✓</span> AI Coach</li>
                    <li><span class="check-icon">✓</span> Knowledge Search</li>
                    <li><span class="check-icon">✓</span> Summarization</li>
                    <li>
                      <span class="check-icon">✓</span> Real-time Transcription
                    </li>
                  </ul>

                  <button
                    type="button"
                    class="slds-button slds-button_brand slds-button_stretch slds-m-top_medium"
                    data-type="Container"
                    onclick={handleSelectTypeFromModal}
                  >
                    Select Container Module
                  </button>
                </div>
              </div>
            </div>
          </div>

          <!-- Modal Footer -->
          <footer class="slds-modal__footer">
            <button
              type="button"
              class="slds-button slds-button_neutral"
              onclick={handleCloseTypeModal}
            >
              Cancel
            </button>
          </footer>
        </div>
      </section>
      <div class="slds-backdrop slds-backdrop_open" role="presentation"></div>
    </template>
  </div>
</template>
